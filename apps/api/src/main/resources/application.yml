# Base configuration. Profile-specific overrides in application-{dev,prod}.yml.
spring:
  application:
    name: backend-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Security / JWT. Provide real PEM material + TTLs in prod via env / secrets manager.
security:
  jwt:
    access-ttl: PT10M             # 10-minute access tokens
    refresh-ttl: P30D             # 30-day refresh tokens
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}   # blank => ephemeral dev keypair
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}

# Transactional-outbox relay polling interval.
outbox:
  relay:
    delay-ms: 1000

# Observability: expose health, info, metrics, and Prometheus scrape endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

server:
  port: ${PORT:8080}
  error:
    include-message: never        # never leak internals; clients get the error envelope

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
