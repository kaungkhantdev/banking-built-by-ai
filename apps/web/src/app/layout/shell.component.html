<div class="flex h-screen bg-slate-50 overflow-hidden">

  <!-- ── Sidebar ── -->
  <aside class="w-64 bg-slate-900 flex flex-col shrink-0 select-none">

    <!-- Brand -->
    <div class="px-5 py-4 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-white" style="font-size:18px">account_balance</span>
        </div>
        <div class="leading-tight">
          <p class="text-white font-semibold text-sm">BankCore</p>
          <p class="text-slate-400 text-xs">Operations Console</p>
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 overflow-y-auto space-y-5">
      @for (section of visibleSections(); track section.label) {
        <div>
          <p class="px-3 mb-1 text-[10px] font-semibold text-slate-500 uppercase tracking-widest">
            {{ section.label }}
          </p>
          <div class="space-y-0.5">
            @for (item of section.items; track item.path) {
              <a [routerLink]="item.path"
                 routerLinkActive="!bg-slate-800 !text-white"
                 class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400
                        hover:text-white hover:bg-slate-800/70 transition-colors text-sm font-medium">
                <span class="material-symbols-outlined" style="font-size:20px">{{ item.icon }}</span>
                {{ item.label }}
              </a>
            }
          </div>
        </div>
      }
    </nav>

    <!-- User footer -->
    <div class="px-3 py-4 border-t border-slate-800 shrink-0">
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800/60 transition-colors">
        <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center shrink-0">
          <span class="text-white text-xs font-bold">OP</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-medium leading-none">Operator</p>
          <p class="text-slate-400 text-xs mt-0.5">Administrator</p>
        </div>
        <button (click)="logout()"
                class="text-slate-400 hover:text-white transition-colors"
                title="Logout">
          <span class="material-symbols-outlined" style="font-size:20px">logout</span>
        </button>
      </div>
    </div>

  </aside>

  <!-- ── Main area ── -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">

    <!-- Top bar -->
    <header class="bg-white border-b border-slate-200 px-6 py-3.5 shrink-0 flex items-center gap-3">
      <span class="material-symbols-outlined text-slate-400" style="font-size:20px">
        {{ currentIcon() }}
      </span>
      <h1 class="text-base font-semibold text-slate-900">{{ currentTitle() }}</h1>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>

  </div>

</div>

<app-toast />
